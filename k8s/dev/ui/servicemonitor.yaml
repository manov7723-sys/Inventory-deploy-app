apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: inventory-deploy-app-ui
  namespace: storefront-dev
  labels:
    app.kubernetes.io/name: inventory-deploy-app-ui
    app.kubernetes.io/managed-by: deepagent
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-deploy-app-ui
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
