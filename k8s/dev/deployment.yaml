apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-deploy-app
  namespace: storefront-dev-1
  labels:
    app.kubernetes.io/name: inventory-deploy-app
    app.kubernetes.io/managed-by: deepagent
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-deploy-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-deploy-app
        app.kubernetes.io/managed-by: deepagent
    spec:
      containers:
        - name: inventory-deploy-app
          image: 400200465532.dkr.ecr.us-east-1.amazonaws.com/inventory-deploy-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 5
          envFrom:
            - secretRef:
                name: app-db
                optional: true
            - secretRef:
                name: app-env
                optional: true
            - secretRef:
                name: app-env-app
                optional: true
          env:
            - name: SESSION_COOKIE_SECURE
              value: "false"
