apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-deploy-app-checkout
  namespace: storefront-dev--1
  labels:
    app.kubernetes.io/name: inventory-deploy-app-checkout
    app.kubernetes.io/managed-by: deepagent
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-deploy-app-checkout
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-deploy-app-checkout
        app.kubernetes.io/managed-by: deepagent
    spec:
      containers:
        - name: inventory-deploy-app-checkout
          image: 400200465532.dkr.ecr.us-east-1.amazonaws.com/inventory-deploy-app-checkout:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 5
          envFrom:
            - secretRef:
                name: app-db
                optional: true
            - secretRef:
                name: app-env
                optional: true
            - secretRef:
                name: app-env-checkout
                optional: true
          env:
            - name: CART_URL
              value: http://cart.storefront-dev--1.svc.cluster.local
            - name: CATALOG_URL
              value: http://catalog.storefront-dev--1.svc.cluster.local
            - name: ORDERS_URL
              value: http://orders.storefront-dev--1.svc.cluster.local
            - name: UI_URL
              value: http://ui.storefront-dev--1.svc.cluster.local
