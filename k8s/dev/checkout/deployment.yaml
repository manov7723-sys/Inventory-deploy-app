apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-deploy-app-checkout
  namespace: storefront-dev-237
  labels:
    app.kubernetes.io/name: inventory-deploy-app-checkout
    app.kubernetes.io/managed-by: deepagent
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-deploy-app-checkout
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-deploy-app-checkout
        app.kubernetes.io/managed-by: deepagent
    spec:
      containers:
        - name: inventory-deploy-app-checkout
          image: 400200465532.dkr.ecr.us-east-1.amazonaws.com/inventory-deploy-app-checkout:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # WARNING: no /health-style route was detected on this service, so
          # probes are TCP-only. A TCP-only probe passes as soon as the socket
          # accepts, even if the app returns 500 to every request. Add a
          # /health endpoint returning 200 and set probePath in deepagent.yaml
          # to upgrade these probes to httpGet.
          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 5
          envFrom:
            - secretRef:
                name: app-db
                optional: true
            - secretRef:
                name: app-env
                optional: true
            - secretRef:
                name: app-env-checkout
                optional: true
          env:
            - name: PORT
              value: "3000"
            - name: CART_URL
              value: http://cart.storefront-dev-237.svc.cluster.local
            - name: CATALOG_URL
              value: http://catalog.storefront-dev-237.svc.cluster.local
            - name: ORDERS_URL
              value: http://orders.storefront-dev-237.svc.cluster.local
            - name: UI_URL
              value: http://ui.storefront-dev-237.svc.cluster.local
