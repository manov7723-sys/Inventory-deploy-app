apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-deploy-app-orders
  namespace: storefront-dev
  labels:
    app.kubernetes.io/name: inventory-deploy-app-orders
    app.kubernetes.io/managed-by: deepagent
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-deploy-app-orders
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-deploy-app-orders
        app.kubernetes.io/managed-by: deepagent
    spec:
      containers:
        - name: inventory-deploy-app-orders
          image: 400200465532.dkr.ecr.us-east-1.amazonaws.com/inventory-deploy-app-orders:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # WARNING: no /health-style route was detected on this service, so
          # probes are TCP-only. A TCP-only probe passes as soon as the socket
          # accepts, even if the app returns 500 to every request. Add a
          # /health endpoint returning 200 and set probePath in deepagent.yaml
          # to upgrade these probes to httpGet.
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 5
          envFrom:
            - secretRef:
                name: app-db
                optional: true
            - secretRef:
                name: app-env
                optional: true
            - secretRef:
                name: app-env-orders
                optional: true
          env:
            - name: PORT
              value: "8080"
            - name: CART_URL
              value: http://cart.storefront-dev.svc.cluster.local
            - name: CATALOG_URL
              value: http://catalog.storefront-dev.svc.cluster.local
            - name: CHECKOUT_URL
              value: http://checkout.storefront-dev.svc.cluster.local
            - name: UI_URL
              value: http://ui.storefront-dev.svc.cluster.local
