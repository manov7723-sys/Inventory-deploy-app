        env:
          ECR: 400200465532.dkr.ecr.us-east-1.amazonaws.com/inventory-deploy-app-catalog
          TAG: ${{ github.sha }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0 image \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            "$ECR:$TAG" || echo "::warning::Trivy flagged issues or could not run — non-blocking, see logs."
      - name: Push catalog image
        env:
          ECR: 400200465532.dkr.ecr.us-east-1.amazonaws.com/inventory-deploy-app-catalog
          TAG: ${{ github.sha }}
        run: |
          docker push "$ECR:$TAG"
          docker push "$ECR:latest"

      - name: Build and tag checkout image
        env:
          ECR: 400200465532.dkr.ecr.us-east-1.amazonaws.com/inventory-deploy-app-checkout
          TAG: ${{ github.sha }}
        run: |
