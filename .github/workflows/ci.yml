      - name: Push ui image
        env:
          ECR: 400200465532.dkr.ecr.us-east-1.amazonaws.com/inventory-deploy-app-ui
          TAG: ${{ github.sha }}
        run: |
          docker push "$ECR:$TAG"
          docker push "$ECR:latest"
