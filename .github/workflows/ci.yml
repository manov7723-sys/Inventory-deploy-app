      - name: Build and tag ui image
        env:
          ECR: 400200465532.dkr.ecr.us-east-1.amazonaws.com/inventory-deploy-app-ui
          TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR:$TAG" -t "$ECR:latest" -f "src/ui/Dockerfile" "src/ui"

      - name: Scan ui image for vulnerabilities (Trivy)
        continue-on-error: true
        env:
          ECR: 400200465532.dkr.ecr.us-east-1.amazonaws.com/inventory-deploy-app-ui
          TAG: ${{ github.sha }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0 image \
