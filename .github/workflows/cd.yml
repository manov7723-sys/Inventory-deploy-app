name: CD (deploy all services)

# Runs automatically after the CI workflow ("CI (build all services)") completes successfully.
# Also supports manual dispatch for redeploying without a fresh build.
on:
  workflow_run:
    workflows: ["CI (build all services)"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

jobs:
  deploy:
    name: Deploy all services
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no stored secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::400200465532:role/gha-manov7723-sys-inventory-deploy-app-inventory-deploy-app-cart
          aws-region: us-east-1

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure cluster access (keyless)
        run: aws eks update-kubeconfig --name "devo-new-testing-app-dev" --region us-east-1

      - name: Ensure namespace storefront-dev-1 is Active (auto-heal if stuck Terminating)
        # Three-stage self-heal — see cicd-pipeline.ts for the full rationale.
        # Stage 1: wait 60s for natural termination.
        # Stage 2: force-clear finalizers on Services + PVCs, wait 30s.
        # Stage 3: nuke the namespace's own finalizer via /finalize subresource.
        run: |
          set -eu
          NS="storefront-dev-1"
          ns_phase() { kubectl get namespace "$NS" -o jsonpath='{.status.phase}' 2>/dev/null || echo ""; }
          for i in $(seq 1 30); do
            p=$(ns_phase)
            { [ -z "$p" ] || [ "$p" = "Active" ]; } && break
            echo "namespace $NS is $p — waiting for natural termination ($i/30)"
            sleep 2
          done
          p=$(ns_phase)
          if [ "$p" = "Terminating" ]; then
            echo "::warning::Namespace $NS still Terminating after 60s — auto-clearing finalizers on Services and PVCs."
            for kind in svc pvc; do
              for res in $(kubectl get "$kind" -n "$NS" -o name 2>/dev/null); do
                echo "  clearing finalizers on $res"
                kubectl patch "$res" -n "$NS" -p '{"metadata":{"finalizers":null}}' --type=merge >/dev/null 2>&1 || true
              done
            done
            for i in $(seq 1 15); do
              p=$(ns_phase)
              { [ -z "$p" ] || [ "$p" = "Active" ]; } && break
              sleep 2
            done
          fi
          p=$(ns_phase)
          if [ "$p" = "Terminating" ]; then
            echo "::warning::Namespace $NS still Terminating — force-clearing its own finalizer via /finalize subresource."
            if command -v jq >/dev/null 2>&1; then
              kubectl get namespace "$NS" -o json | jq '.spec.finalizers = []' | kubectl replace --raw "/api/v1/namespaces/$NS/finalize" -f - >/dev/null 2>&1 || true
            else
              printf '%s' '{"apiVersion":"v1","kind":"Namespace","metadata":{"name":"'"$NS"'"},"spec":{"finalizers":[]}}' | kubectl replace --raw "/api/v1/namespaces/$NS/finalize" -f - >/dev/null 2>&1 || true
            fi
            sleep 3
          fi
          p=$(ns_phase)
          [ -z "$p" ] && kubectl create namespace "$NS"
          p=$(ns_phase)
          if [ "$p" != "Active" ]; then
            echo "::error::Namespace $NS auto-heal exhausted; still $p. Ask the agent to run unstick_terminating_namespace for deep diagnosis."
            exit 1
          fi
          echo "namespace $NS is Active — proceeding with apply."

      - name: Apply cart manifests
        id: apply_cart
        # Prefer manifest.yaml — deploy_my_app writes exactly that file, and
        # applying the whole dir picks up any stale *.yaml (e.g. a
        # hand-committed service.yaml from an older scaffold) that
        # alphabetically-sorts AFTER it and silently overrides the freshly
        # generated resource (2026-08 incident). Fall back to the dir for
        # repos whose manifests are still split across multiple files.
        run: |
          if [ -f "k8s/dev/cart/manifest.yaml" ]; then
            kubectl apply -n storefront-dev-1 -f "k8s/dev/cart/manifest.yaml"
          else
            kubectl apply -n storefront-dev-1 -f "k8s/dev/cart/"
          fi

      - name: Restart cart rollout (image tag "latest" — force pods onto the new build)
        id: restart_cart
        run: kubectl rollout restart deployment/inventory-deploy-app-cart -n storefront-dev-1

      - name: Wait for cart rollout
        id: wait_cart
        run: kubectl rollout status deployment/inventory-deploy-app-cart -n storefront-dev-1 --timeout=180s

      - name: Rollback cart on failed rollout
        # Scoped to THIS service's own step outcomes (see sequentialDeploySteps
        # comment). `always()` lets the step evaluate even when the job status
        # is failure; the inner condition prevents rollback firing for a
        # service whose steps were skipped because an earlier service failed.
        if: ${{ always() && (steps.apply_cart.outcome == 'failure' || steps.restart_cart.outcome == 'failure' || steps.wait_cart.outcome == 'failure') }}
        run: |
          echo "::warning::Rollout of inventory-deploy-app-cart failed its health check — rolling back to the previous revision."
          kubectl rollout undo deployment/inventory-deploy-app-cart -n storefront-dev-1
          kubectl rollout status deployment/inventory-deploy-app-cart -n storefront-dev-1 --timeout=120s

      - name: Apply catalog manifests
        id: apply_catalog
        # Prefer manifest.yaml — deploy_my_app writes exactly that file, and
        # applying the whole dir picks up any stale *.yaml (e.g. a
        # hand-committed service.yaml from an older scaffold) that
        # alphabetically-sorts AFTER it and silently overrides the freshly
        # generated resource (2026-08 incident). Fall back to the dir for
        # repos whose manifests are still split across multiple files.
        run: |
          if [ -f "k8s/dev/catalog/manifest.yaml" ]; then
            kubectl apply -n storefront-dev-1 -f "k8s/dev/catalog/manifest.yaml"
          else
            kubectl apply -n storefront-dev-1 -f "k8s/dev/catalog/"
          fi

      - name: Restart catalog rollout (image tag "latest" — force pods onto the new build)
        id: restart_catalog
        run: kubectl rollout restart deployment/inventory-deploy-app-catalog -n storefront-dev-1

      - name: Wait for catalog rollout
        id: wait_catalog
        run: kubectl rollout status deployment/inventory-deploy-app-catalog -n storefront-dev-1 --timeout=180s

      - name: Rollback catalog on failed rollout
        # Scoped to THIS service's own step outcomes (see sequentialDeploySteps
        # comment). `always()` lets the step evaluate even when the job status
        # is failure; the inner condition prevents rollback firing for a
        # service whose steps were skipped because an earlier service failed.
        if: ${{ always() && (steps.apply_catalog.outcome == 'failure' || steps.restart_catalog.outcome == 'failure' || steps.wait_catalog.outcome == 'failure') }}
        run: |
          echo "::warning::Rollout of inventory-deploy-app-catalog failed its health check — rolling back to the previous revision."
          kubectl rollout undo deployment/inventory-deploy-app-catalog -n storefront-dev-1
          kubectl rollout status deployment/inventory-deploy-app-catalog -n storefront-dev-1 --timeout=120s

      - name: Apply checkout manifests
        id: apply_checkout
        # Prefer manifest.yaml — deploy_my_app writes exactly that file, and
        # applying the whole dir picks up any stale *.yaml (e.g. a
        # hand-committed service.yaml from an older scaffold) that
        # alphabetically-sorts AFTER it and silently overrides the freshly
        # generated resource (2026-08 incident). Fall back to the dir for
        # repos whose manifests are still split across multiple files.
        run: |
          if [ -f "k8s/dev/checkout/manifest.yaml" ]; then
            kubectl apply -n storefront-dev-1 -f "k8s/dev/checkout/manifest.yaml"
          else
            kubectl apply -n storefront-dev-1 -f "k8s/dev/checkout/"
          fi

      - name: Restart checkout rollout (image tag "latest" — force pods onto the new build)
        id: restart_checkout
        run: kubectl rollout restart deployment/inventory-deploy-app-checkout -n storefront-dev-1

      - name: Wait for checkout rollout
        id: wait_checkout
        run: kubectl rollout status deployment/inventory-deploy-app-checkout -n storefront-dev-1 --timeout=180s

      - name: Rollback checkout on failed rollout
        # Scoped to THIS service's own step outcomes (see sequentialDeploySteps
        # comment). `always()` lets the step evaluate even when the job status
        # is failure; the inner condition prevents rollback firing for a
        # service whose steps were skipped because an earlier service failed.
        if: ${{ always() && (steps.apply_checkout.outcome == 'failure' || steps.restart_checkout.outcome == 'failure' || steps.wait_checkout.outcome == 'failure') }}
        run: |
          echo "::warning::Rollout of inventory-deploy-app-checkout failed its health check — rolling back to the previous revision."
          kubectl rollout undo deployment/inventory-deploy-app-checkout -n storefront-dev-1
          kubectl rollout status deployment/inventory-deploy-app-checkout -n storefront-dev-1 --timeout=120s

      - name: Apply orders manifests
        id: apply_orders
        # Prefer manifest.yaml — deploy_my_app writes exactly that file, and
        # applying the whole dir picks up any stale *.yaml (e.g. a
        # hand-committed service.yaml from an older scaffold) that
        # alphabetically-sorts AFTER it and silently overrides the freshly
        # generated resource (2026-08 incident). Fall back to the dir for
        # repos whose manifests are still split across multiple files.
        run: |
          if [ -f "k8s/dev/orders/manifest.yaml" ]; then
            kubectl apply -n storefront-dev-1 -f "k8s/dev/orders/manifest.yaml"
          else
            kubectl apply -n storefront-dev-1 -f "k8s/dev/orders/"
          fi

      - name: Restart orders rollout (image tag "latest" — force pods onto the new build)
        id: restart_orders
        run: kubectl rollout restart deployment/inventory-deploy-app-orders -n storefront-dev-1

      - name: Wait for orders rollout
        id: wait_orders
        run: kubectl rollout status deployment/inventory-deploy-app-orders -n storefront-dev-1 --timeout=180s

      - name: Rollback orders on failed rollout
        # Scoped to THIS service's own step outcomes (see sequentialDeploySteps
        # comment). `always()` lets the step evaluate even when the job status
        # is failure; the inner condition prevents rollback firing for a
        # service whose steps were skipped because an earlier service failed.
        if: ${{ always() && (steps.apply_orders.outcome == 'failure' || steps.restart_orders.outcome == 'failure' || steps.wait_orders.outcome == 'failure') }}
        run: |
          echo "::warning::Rollout of inventory-deploy-app-orders failed its health check — rolling back to the previous revision."
          kubectl rollout undo deployment/inventory-deploy-app-orders -n storefront-dev-1
          kubectl rollout status deployment/inventory-deploy-app-orders -n storefront-dev-1 --timeout=120s

      - name: Apply ui manifests
        id: apply_ui
        # Prefer manifest.yaml — deploy_my_app writes exactly that file, and
        # applying the whole dir picks up any stale *.yaml (e.g. a
        # hand-committed service.yaml from an older scaffold) that
        # alphabetically-sorts AFTER it and silently overrides the freshly
        # generated resource (2026-08 incident). Fall back to the dir for
        # repos whose manifests are still split across multiple files.
        run: |
          if [ -f "k8s/dev/ui/manifest.yaml" ]; then
            kubectl apply -n storefront-dev-1 -f "k8s/dev/ui/manifest.yaml"
          else
            kubectl apply -n storefront-dev-1 -f "k8s/dev/ui/"
          fi

      - name: Restart ui rollout (image tag "latest" — force pods onto the new build)
        id: restart_ui
        run: kubectl rollout restart deployment/inventory-deploy-app-ui -n storefront-dev-1

      - name: Wait for ui rollout
        id: wait_ui
        run: kubectl rollout status deployment/inventory-deploy-app-ui -n storefront-dev-1 --timeout=180s

      - name: Rollback ui on failed rollout
