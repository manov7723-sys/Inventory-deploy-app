        # confuses the log). We still print a clear message so the reader knows
        # the pipeline recognised a first-deploy vs. an actual failure.
        if: ${{ always() && (steps.apply_orders.outcome == 'failure' || steps.restart_orders.outcome == 'failure' || steps.wait_orders.outcome == 'failure') }}
        run: |
          REVS=$(kubectl rollout history deployment/inventory-deploy-app-orders -n storefront-dev 2>/dev/null | tail -n +3 | grep -c '^' || echo 0)
          if [ "$REVS" -lt 2 ]; then
            echo "::warning::Rollout of inventory-deploy-app-orders failed and this is the first-ever deploy (rollout history has $REVS revision). Nothing to roll back to — leaving the failed pods in place so you can debug them."
            exit 1
          fi
          echo "::warning::Rollout of inventory-deploy-app-orders failed its health check — rolling back to the previous revision."
          kubectl rollout undo deployment/inventory-deploy-app-orders -n storefront-dev
          kubectl rollout status deployment/inventory-deploy-app-orders -n storefront-dev --timeout=240s

      - name: Apply ui manifests
        id: apply_ui
        # Prefer manifest.yaml — deploy_my_app writes exactly that file, and
        # applying the whole dir picks up any stale *.yaml (e.g. a
        # hand-committed service.yaml from an older scaffold) that
        # alphabetically-sorts AFTER it and silently overrides the freshly
        # generated resource (2026-08 incident). Fall back to the dir for
        # repos whose manifests are still split across multiple files.
        run: |
          if [ -f "k8s/dev/ui/manifest.yaml" ]; then
            kubectl apply -n storefront-dev -f "k8s/dev/ui/manifest.yaml"
          else
            kubectl apply -n storefront-dev -f "k8s/dev/ui/"
          fi

      - name: Restart ui rollout (image tag "latest" — force pods onto the new build)
        id: restart_ui
        run: kubectl rollout restart deployment/inventory-deploy-app-ui -n storefront-dev

      - name: Wait for ui rollout
        id: wait_ui
        run: kubectl rollout status deployment/inventory-deploy-app-ui -n storefront-dev --timeout=360s

      - name: Diagnose ui on failed rollout
        # Runs BEFORE rollback so the job log preserves what actually went wrong
        # — the rollback undoes the state that would answer "why did it fail?".
        # Prints pods + describe + logs + events, and detects the port-mismatch
        # class (contract §5) by reading /proc/net/tcp{,6} inside the container.
        if: ${{ always() && (steps.apply_ui.outcome == 'failure' || steps.restart_ui.outcome == 'failure' || steps.wait_ui.outcome == 'failure') }}
        continue-on-error: true
        run: |
          echo "::group::pods"
          kubectl get pods -n storefront-dev -l app.kubernetes.io/name=inventory-deploy-app-ui -o wide || true
          echo "::endgroup::"
          echo "::group::describe"
          kubectl describe pods -n storefront-dev -l app.kubernetes.io/name=inventory-deploy-app-ui | tail -n 60 || true
          echo "::endgroup::"
          echo "::group::logs"
          kubectl logs -n storefront-dev -l app.kubernetes.io/name=inventory-deploy-app-ui --tail=100 --all-containers=true --prefix=true || true
          echo "::endgroup::"
          echo "::group::events"
          kubectl get events -n storefront-dev --sort-by=.lastTimestamp | tail -n 30 || true
          echo "::endgroup::"
          echo "::group::deployment facts (from facts.json, committed at discovery time)"
          FACTS_FILE=$(ls -1 k8s/*/ui/facts.json k8s/*/facts.json 2>/dev/null | head -n 1 || true)
          if [ -n "$FACTS_FILE" ] && [ -f "$FACTS_FILE" ]; then
            echo "reading $FACTS_FILE"
            if command -v jq >/dev/null 2>&1; then jq . "$FACTS_FILE" || cat "$FACTS_FILE"; else cat "$FACTS_FILE"; fi
          else
            echo "no facts.json found (this pipeline predates the discovery layer, or discovery failed for this service)"
          fi
          echo "::endgroup::"
          echo "::group::port-mismatch check"
          POD=$(kubectl get pods -n storefront-dev -l app.kubernetes.io/name=inventory-deploy-app-ui -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -n "$POD" ]; then
            PROBE_PORT=$(kubectl get pod -n storefront-dev "$POD" -o jsonpath='{.spec.containers[0].ports[0].containerPort}' 2>/dev/null || echo "")
            LISTENING=$(kubectl exec -n storefront-dev "$POD" -- sh -c '
              for f in /proc/net/tcp /proc/net/tcp6; do
                [ -r "$f" ] || continue
                awk "NR>1 && \$4==\"0A\" { split(\$2,a,\":\"); print strtonum(\"0x\" a[2]) }" "$f"
              done | sort -u
            ' 2>/dev/null | tr "\n" " " || true)
            echo "probe expects port: $PROBE_PORT"
            echo "app is listening on: ${LISTENING:-(nothing — process may have exited)}"
            if [ -n "$PROBE_PORT" ] && [ -n "$LISTENING" ] && ! echo " $LISTENING " | grep -q " $PROBE_PORT "; then
              echo "::error::PORT MISMATCH — probes dial :$PROBE_PORT but the app is only listening on: $LISTENING. Set PORT env in the manifest to match the app, or update containerPort/probe ports."
            fi
          else
            echo "no pod found for label app.kubernetes.io/name=inventory-deploy-app-ui"
          fi
          echo "::endgroup::"

      - name: Rollback ui on failed rollout
        # Scoped to THIS service's own step outcomes (see sequentialDeploySteps
        # comment). `always()` lets the step evaluate even when the job status
        # is failure; the inner condition prevents rollback firing for a
        # service whose steps were skipped because an earlier service failed.
        # Contract §5: skip `rollout undo` on the first-ever deploy (history
        # has only one revision — there's nothing to undo to; erroring on that
        # confuses the log). We still print a clear message so the reader knows
        # the pipeline recognised a first-deploy vs. an actual failure.
        if: ${{ always() && (steps.apply_ui.outcome == 'failure' || steps.restart_ui.outcome == 'failure' || steps.wait_ui.outcome == 'failure') }}
        run: |
          REVS=$(kubectl rollout history deployment/inventory-deploy-app-ui -n storefront-dev 2>/dev/null | tail -n +3 | grep -c '^' || echo 0)
          if [ "$REVS" -lt 2 ]; then
            echo "::warning::Rollout of inventory-deploy-app-ui failed and this is the first-ever deploy (rollout history has $REVS revision). Nothing to roll back to — leaving the failed pods in place so you can debug them."
            exit 1
          fi
          echo "::warning::Rollout of inventory-deploy-app-ui failed its health check — rolling back to the previous revision."
          kubectl rollout undo deployment/inventory-deploy-app-ui -n storefront-dev
          kubectl rollout status deployment/inventory-deploy-app-ui -n storefront-dev --timeout=240s
